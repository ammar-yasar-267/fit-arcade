<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-android" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040410"/>
      <stop offset="100%" stop-color="#0A0820"/>
    </linearGradient>
    
    <filter id="glow-android" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="192" height="192" rx="48" fill="url(#bg-android)" stroke="#2A2550" stroke-width="3"/>

  <!-- Main icon content -->
  <g transform="translate(96, 96)" filter="url(#glow-android)">
    <!-- Head -->
    <circle cx="0" cy="-35" r="8" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="2"/>
    
    <!-- Central spine line -->
    <line x1="0" y1="-25" x2="0" y2="15" stroke="#06B6D4" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Left arm raised -->
    <path d="M 0 -15 L -35 -30" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="-35" cy="-30" r="3" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="1.5"/>
    
    <!-- Right arm raised -->
    <path d="M 0 -15 L 35 -30" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="35" cy="-30" r="3" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="1.5"/>
    
    <!-- Left leg -->
    <path d="M 0 15 L -28 50" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="-28" cy="50" r="3" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="1.5"/>
    
    <!-- Right leg -->
    <path d="M 0 15 L 28 50" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="28" cy="50" r="3" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="1.5"/>
    
    <!-- Joint markers -->
    <circle cx="0" cy="-15" r="2.5" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="1"/>
    <circle cx="0" cy="15" r="2.5" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="1"/>
  </g>
</svg>
