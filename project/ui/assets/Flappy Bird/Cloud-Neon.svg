<svg width="220" height="90" viewBox="0 0 220 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cloud Body Gradient -->
    <linearGradient id="nebulaBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241238"/>
      <stop offset="60%" stop-color="#150A22"/>
      <stop offset="100%" stop-color="#0B0612"/>
    </linearGradient>

    <!-- Warm Rim Gradient -->
    <linearGradient id="warmRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5500"/>
      <stop offset="50%" stop-color="#FF8A1F"/>
      <stop offset="100%" stop-color="#FFD043"/>
    </linearGradient>
  </defs>

  <!-- Ambient Flame Glow Halo Behind Cloud -->
  <ellipse cx="110" cy="56" rx="88" ry="22" fill="#FF8A1F" opacity="0.16"/>
  <circle cx="78" cy="42" r="28" fill="#FF5500" opacity="0.14"/>
  <circle cx="114" cy="28" r="35" fill="#FF8A1F" opacity="0.18"/>
  <circle cx="152" cy="38" r="26" fill="#FFD043" opacity="0.12"/>

  <!-- Solid Dark Cyber Nebula Body -->
  <ellipse cx="110" cy="62" rx="90" ry="21" fill="url(#nebulaBody)"/>
  <circle cx="78" cy="47" r="28" fill="url(#nebulaBody)"/>
  <circle cx="114" cy="32" r="34" fill="url(#nebulaBody)"/>
  <circle cx="152" cy="43" r="26" fill="url(#nebulaBody)"/>
  
  <!-- Fill Interior Blends -->
  <ellipse cx="96" cy="50" rx="22" ry="18" fill="url(#nebulaBody)"/>
  <ellipse cx="133" cy="49" rx="22" ry="18" fill="url(#nebulaBody)"/>

  <!-- Mid-Tone Depth Blobs -->
  <circle cx="114" cy="34" r="20" fill="#3D1A54" opacity="0.45"/>
  <circle cx="80" cy="48" r="15" fill="#2E1442" opacity="0.40"/>
  <circle cx="150" cy="44" r="13" fill="#2E1442" opacity="0.35"/>

  <!-- Neon Flame Rim Stroke: Bottom Base -->
  <ellipse cx="110" cy="62" rx="90" ry="21" fill="none" stroke="#FF5500" stroke-width="1.6" opacity="0.75"/>
  
  <!-- Neon Flame Rim Stroke: Left Bump -->
  <circle cx="78" cy="47" r="28" fill="none" stroke="#FF8A1F" stroke-width="1.6" opacity="0.85"/>
  
  <!-- Neon Flame Rim Stroke: Center Peak -->
  <circle cx="114" cy="32" r="34" fill="none" stroke="url(#warmRim)" stroke-width="2.2" opacity="0.95"/>
  
  <!-- Neon Flame Rim Stroke: Right Bump -->
  <circle cx="152" cy="43" r="26" fill="none" stroke="#FF8A1F" stroke-width="1.6" opacity="0.85"/>

  <!-- Top Peak Hot Edge Highlights -->
  <path d="M 70,24 Q 78,19 86,23" fill="none" stroke="#FFF2B0" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
  <path d="M 100,5 Q 114,-1 128,5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.95"/>
  <path d="M 142,20 Q 150,17 158,21" fill="none" stroke="#FFF2B0" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>

  <!-- Sparkle Dots at Peaks -->
  <circle cx="114" cy="0" r="2.8" fill="#FFFFFF"/>
  <circle cx="78" cy="20" r="2.0" fill="#FFD043"/>
  <circle cx="150" cy="18" r="1.8" fill="#FFD043"/>

  <!-- Interior Energy Shimmer Wisps -->
  <ellipse cx="102" cy="42" rx="18" ry="4" fill="#FF8A1F" opacity="0.25"/>
  <ellipse cx="128" cy="50" rx="14" ry="3" fill="#FFD043" opacity="0.20"/>
</svg>
