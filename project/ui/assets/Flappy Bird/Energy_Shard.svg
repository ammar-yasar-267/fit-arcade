<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Shard Gradient -->
    <linearGradient id="shardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#D4FF3A"/>
      <stop offset="70%" stop-color="#FFD043"/>
      <stop offset="100%" stop-color="#FF8A1F"/>
    </linearGradient>
    <radialGradient id="shardAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD043" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FF8A1F" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF5500" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Pulsing Glow -->
  <circle cx="20" cy="20" r="18" fill="url(#shardAura)"/>

  <!-- Rotating Diamond Shard Core -->
  <polygon points="20,4 32,20 20,36 8,20" fill="url(#shardGrad)"/>
  
  <!-- Facet Highlights -->
  <polygon points="20,4 20,20 8,20" fill="#FFFFFF" opacity="0.6"/>
  <polygon points="20,4 32,20 20,20" fill="#FFE885" opacity="0.4"/>
  <polygon points="8,20 20,20 20,36" fill="#FF8A1F" opacity="0.4"/>
  <polygon points="20,20 32,20 20,36" fill="#E65100" opacity="0.6"/>

  <!-- Center Sparkle Glint -->
  <polygon points="20,12 22,20 20,28 18,20" fill="#FFFFFF"/>
  <polygon points="12,20 20,22 28,20 20,18" fill="#FFFFFF"/>
  <circle cx="20" cy="20" r="2.5" fill="#FFFFFF"/>
</svg>
