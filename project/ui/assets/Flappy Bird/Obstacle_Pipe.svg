<svg width="80" height="300" viewBox="0 0 80 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Pipe Body Gradient (Carbon Dark Armor) -->
    <linearGradient id="armorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E0E12"/>
      <stop offset="15%" stop-color="#1A1A22"/>
      <stop offset="45%" stop-color="#24232E"/>
      <stop offset="75%" stop-color="#181820"/>
      <stop offset="100%" stop-color="#0A0A0D"/>
    </linearGradient>

    <!-- Energy Core Conduit Gradient -->
    <linearGradient id="energyCore" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E04000"/>
      <stop offset="30%" stop-color="#FF8A1F"/>
      <stop offset="50%" stop-color="#FFE082"/>
      <stop offset="70%" stop-color="#FF8A1F"/>
      <stop offset="100%" stop-color="#E04000"/>
    </linearGradient>

    <!-- Gate Collar Gradient -->
    <linearGradient id="collarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B1A24"/>
      <stop offset="35%" stop-color="#2D2B3D"/>
      <stop offset="70%" stop-color="#22212E"/>
      <stop offset="100%" stop-color="#14131C"/>
    </linearGradient>

    <!-- Caution Stripe Pattern -->
    <pattern id="hazardStripes" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="6" height="12" fill="#FF8A1F"/>
      <rect x="6" y="0" width="6" height="12" fill="#0B0B0C"/>
    </pattern>
  </defs>

  <!-- Ambient Outer Glow along Pipe Body -->
  <rect x="4" y="0" width="72" height="250" fill="#FF8A1F" opacity="0.06"/>

  <!-- Main Carbon Tower Column -->
  <rect x="8" y="0" width="64" height="252" fill="url(#armorGrad)"/>
  
  <!-- Outer Bezel Borders -->
  <rect x="8" y="0" width="2" height="252" fill="#3D3B4D"/>
  <rect x="70" y="0" width="2" height="252" fill="#14131C"/>

  <!-- Central High-Voltage Energy Channel -->
  <rect x="36" y="0" width="8" height="252" fill="url(#energyCore)"/>
  <rect x="39" y="0" width="2" height="252" fill="#FFFFFF" opacity="0.75"/>

  <!-- Secondary Energy Rail Left & Right -->
  <rect x="18" y="0" width="3" height="252" fill="#FF8A1F" opacity="0.4"/>
  <rect x="59" y="0" width="3" height="252" fill="#FF8A1F" opacity="0.4"/>

  <!-- Periodic Segment Ribs & Status LEDs -->
  <rect x="8" y="45" width="64" height="3" fill="#0B0B0C"/>
  <rect x="8" y="48" width="64" height="1" fill="#FF8A1F" opacity="0.6"/>
  <circle cx="13" cy="46.5" r="1.5" fill="#FFD043"/>
  <circle cx="67" cy="46.5" r="1.5" fill="#FFD043"/>

  <rect x="8" y="105" width="64" height="3" fill="#0B0B0C"/>
  <rect x="8" y="108" width="64" height="1" fill="#FF8A1F" opacity="0.6"/>
  <circle cx="13" cy="106.5" r="1.5" fill="#FFD043"/>
  <circle cx="67" cy="106.5" r="1.5" fill="#FFD043"/>

  <rect x="8" y="165" width="64" height="3" fill="#0B0B0C"/>
  <rect x="8" y="168" width="64" height="1" fill="#FF8A1F" opacity="0.6"/>
  <circle cx="13" cy="166.5" r="1.5" fill="#FFD043"/>
  <circle cx="67" cy="166.5" r="1.5" fill="#FFD043"/>

  <rect x="8" y="220" width="64" height="3" fill="#0B0B0C"/>
  <rect x="8" y="223" width="64" height="1" fill="#FF8A1F" opacity="0.6"/>

  <!-- GATE EMITTER CAP (Facing the flight gap) -->
  <!-- Ambient Cap Glow -->
  <rect x="0" y="246" width="80" height="54" rx="4" fill="#FF8A1F" opacity="0.18"/>

  <!-- Collar Base Block -->
  <rect x="0" y="248" width="80" height="48" rx="3" fill="url(#collarGrad)" stroke="#3D3A50" stroke-width="1"/>

  <!-- Top Caution Hazard Stripe Ribbon -->
  <rect x="2" y="250" width="76" height="8" fill="url(#hazardStripes)" opacity="0.85"/>

  <!-- Main Energy Core Emitter Chamber -->
  <rect x="6" y="261" width="68" height="24" rx="2" fill="#0B0B0C"/>
  
  <!-- Glowing Plasma Emitter Core -->
  <rect x="12" y="265" width="56" height="16" rx="2" fill="url(#energyCore)"/>
  <rect x="20" y="268" width="40" height="10" rx="1" fill="#FFFFFF" opacity="0.7"/>

  <!-- Focus Emitter Pins -->
  <circle cx="16" cy="273" r="3" fill="#0B0B0C"/>
  <circle cx="16" cy="273" r="1.5" fill="#FFE082"/>

  <circle cx="64" cy="273" r="3" fill="#0B0B0C"/>
  <circle cx="64" cy="273" r="1.5" fill="#FFE082"/>

  <!-- Extreme Rim Emitter Blade (Bright Laser Edge at the very tip) -->
  <rect x="0" y="294" width="80" height="6" fill="#FF8A1F"/>
  <rect x="4" y="296" width="72" height="2" fill="#FFFFFF"/>
</svg>
