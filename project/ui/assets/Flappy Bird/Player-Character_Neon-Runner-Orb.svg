<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="40" cy="44" r="34" fill="#06B6D4" opacity="0.08"/>

  <polygon points="8,46 26,40 26,54" fill="#0EA5E9" opacity="0.8"/>
  <polygon points="12,46 24,42 24,52" fill="#67E8F9" opacity="0.25"/>

  <ellipse cx="34" cy="24" rx="20" ry="8" fill="#06B6D4" filter="url(#glow)" transform="rotate(-30 34 24)"/>
  <ellipse cx="34" cy="24" rx="15" ry="5" fill="#67E8F9" opacity="0.2" transform="rotate(-30 34 24)"/>

  <ellipse cx="44" cy="46" rx="20" ry="16" fill="#06B6D4" filter="url(#softGlow)"/>
  <ellipse cx="38" cy="38" rx="10" ry="9" fill="#FFFFFF" opacity="0.1"/>

  <ellipse cx="56" cy="32" rx="14" ry="12" fill="#06B6D4" filter="url(#glow)"/>

  <circle cx="62" cy="28" r="5.5" fill="#FFFFFF" filter="url(#glow)"/>
  <circle cx="63" cy="28" r="3" fill="#0C1A2E"/>
  <circle cx="64" cy="27" r="1.3" fill="#FFFFFF"/>

  <polygon points="68,30 78,33 68,36" fill="#F59E0B" filter="url(#glow)"/>
  <polygon points="68,30 76,33 68,34.5" fill="#FCD34D" opacity="0.7"/>
</svg>
