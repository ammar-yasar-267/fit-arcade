<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Volt Cyber Body Gradient -->
    <linearGradient id="voltBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9FF85"/>
      <stop offset="35%" stop-color="#D4FF3A"/>
      <stop offset="80%" stop-color="#9BC800"/>
      <stop offset="100%" stop-color="#678E00"/>
    </linearGradient>

    <!-- Hot Volt Glow Gradient -->
    <linearGradient id="hotVolt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E9FF85"/>
      <stop offset="100%" stop-color="#D4FF3A"/>
    </linearGradient>

    <!-- Carbon Dark Armor -->
    <linearGradient id="carbonArmor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#25252B"/>
      <stop offset="100%" stop-color="#0E0E12"/>
    </linearGradient>
  </defs>

  <!-- Ambient Energy Halo -->
  <ellipse cx="50" cy="54" rx="46" ry="38" fill="#D4FF3A" opacity="0.12"/>
  <ellipse cx="52" cy="52" rx="34" ry="26" fill="#D4FF3A" opacity="0.08"/>

  <!-- Tail (Dynamic Cyber Thruster Fin) -->
  <polygon points="4,48 24,36 24,58" fill="url(#voltBody)"/>
  <polygon points="8,48 22,40 22,54" fill="#FFFFFF" opacity="0.35"/>
  <polygon points="2,48 12,46 12,50" fill="#FFFFFF" opacity="0.8"/>

  <!-- Main Body Torso (Aerodynamic Runner Chassis) -->
  <rect x="20" y="36" width="46" height="32" rx="10" fill="url(#voltBody)"/>
  <!-- Top Specular Trim -->
  <rect x="24" y="38" width="38" height="5" rx="2.5" fill="#FFFFFF" opacity="0.45"/>

  <!-- Cyber Spines (Volt Plasma Blades on Back) -->
  <polygon points="24,36 28,22 33,36" fill="url(#hotVolt)"/>
  <polygon points="34,36 38,18 43,36" fill="url(#hotVolt)"/>
  <polygon points="44,36 48,24 53,36" fill="url(#hotVolt)"/>

  <!-- Neck Linkage (Carbon Cyber Joint) -->
  <rect x="56" y="24" width="14" height="18" rx="4" fill="url(#carbonArmor)" stroke="#D4FF3A" stroke-width="1"/>

  <!-- Head / Helmet (Forward-Leaning Athletic Raptor) -->
  <rect x="52" y="12" width="42" height="26" rx="8" fill="url(#voltBody)"/>
  <!-- Brow Armor Plating -->
  <path d="M 52,14 L 88,14 L 94,22 L 60,22 Z" fill="url(#carbonArmor)"/>
  <rect x="56" y="14" width="30" height="3" rx="1.5" fill="#FFFFFF" opacity="0.5"/>

  <!-- Snout / Lower Jaw -->
  <rect x="86" y="22" width="12" height="8" rx="3" fill="url(#carbonArmor)"/>
  <rect x="86" y="28" width="10" height="8" rx="3" fill="url(#voltBody)"/>
  <line x1="86" y1="28" x2="96" y2="28" stroke="#0E0E12" stroke-width="1.5"/>

  <!-- Athletic Cyber Eye (Glowing Visor) -->
  <circle cx="78" cy="20" r="6" fill="#0E0E12" stroke="#D4FF3A" stroke-width="1.2"/>
  <circle cx="78.5" cy="20" r="4" fill="#FFFFFF"/>
  <circle cx="79.5" cy="19.5" r="2.2" fill="#D4FF3A"/>
  <circle cx="80.2" cy="19" r="1" fill="#FFFFFF"/>

  <!-- High-Tech Circuit Panel on Flank -->
  <path d="M 32,50 L 46,50 L 52,56 L 60,56" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
  <circle cx="46" cy="50" r="1.8" fill="#FFFFFF"/>
  <circle cx="60" cy="56" r="1.8" fill="#FFFFFF"/>

  <!-- Foreground Arm (Aerodynamic Blade Wing) -->
  <polygon points="50,48 64,54 58,62 46,54" fill="url(#carbonArmor)" stroke="#D4FF3A" stroke-width="1"/>
  <polygon points="58,54 66,57 60,61" fill="#D4FF3A"/>

  <!-- Back Leg (Darker Depth Layer) -->
  <rect x="25" y="64" width="12" height="24" rx="4" fill="url(#carbonArmor)" stroke="#9BC800" stroke-width="1"/>
  <polygon points="21,86 42,86 38,94 18,94" fill="url(#carbonArmor)"/>

  <!-- Front Leg (Bright Primary Stride) -->
  <rect x="42" y="64" width="14" height="25" rx="5" fill="url(#voltBody)"/>
  <!-- Metallic Foot Pad -->
  <polygon points="36,86 60,86 56,94 32,94" fill="url(#carbonArmor)" stroke="#D4FF3A" stroke-width="1.2"/>
  <rect x="38" y="87" width="18" height="3" rx="1.5" fill="#D4FF3A"/>
</svg>
