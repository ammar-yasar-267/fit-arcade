<svg width="80" height="100" viewBox="0 0 80 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cyan Cyber Chassis Gradient -->
    <linearGradient id="cyanChassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0FBFF"/>
      <stop offset="30%" stop-color="#3AE0FF"/>
      <stop offset="75%" stop-color="#00A2C7"/>
      <stop offset="100%" stop-color="#00627A"/>
    </linearGradient>

    <!-- Cockpit Visor Gradient -->
    <linearGradient id="cockpitVisor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#A5F3FC"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>

    <!-- Carbon Fiber Armor -->
    <linearGradient id="carbonBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242731"/>
      <stop offset="100%" stop-color="#0D0E13"/>
    </linearGradient>

    <!-- Dual Thruster Hot Plasma -->
    <linearGradient id="ionFlame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#3AE0FF"/>
      <stop offset="75%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Ambient Under-Glow Halo -->
  <ellipse cx="40" cy="54" rx="36" ry="38" fill="#3AE0FF" opacity="0.16"/>

  <!-- Twin Ion Thruster Plumes -->
  <polygon points="21,78 25,98 17,98" fill="url(#ionFlame)"/>
  <polygon points="21,78 23,93 19,93" fill="#FFFFFF" opacity="0.8"/>

  <polygon points="59,78 63,98 55,98" fill="url(#ionFlame)"/>
  <polygon points="59,78 61,93 57,93" fill="#FFFFFF" opacity="0.8"/>

  <!-- Left Aerodynamic Swept Wing -->
  <polygon points="4,66 26,38 28,74" fill="url(#carbonBody)" stroke="#3AE0FF" stroke-width="1.2"/>
  <polygon points="8,64 24,42 26,70" fill="url(#cyanChassis)" opacity="0.85"/>
  <polygon points="2,66 12,52 14,68" fill="#3AE0FF"/>

  <!-- Right Aerodynamic Swept Wing -->
  <polygon points="76,66 54,38 52,74" fill="url(#carbonBody)" stroke="#3AE0FF" stroke-width="1.2"/>
  <polygon points="72,64 56,42 54,70" fill="url(#cyanChassis)" opacity="0.85"/>
  <polygon points="78,66 68,52 66,68" fill="#3AE0FF"/>

  <!-- Central Hover Hull (Stealth Diamond Fuselage) -->
  <polygon points="40,6 62,44 54,80 26,80 18,44" fill="url(#carbonBody)" stroke="#3AE0FF" stroke-width="1.5"/>

  <!-- Cyan Flank Armor Plates -->
  <polygon points="22,46 32,32 32,74 24,76" fill="url(#cyanChassis)"/>
  <polygon points="58,46 48,32 48,74 56,76" fill="url(#cyanChassis)"/>

  <!-- Nose Cone Laser Fin -->
  <polygon points="40,8 43,26 37,26" fill="#FFFFFF"/>
  <polygon points="40,6 44,28 36,28" fill="url(#cyanChassis)" opacity="0.9"/>

  <!-- Pilot Cockpit Canopy (Gleaming Cyan Visor) -->
  <polygon points="40,24 50,48 40,58 30,48" fill="url(#cockpitVisor)" stroke="#FFFFFF" stroke-width="1"/>
  <ellipse cx="37" cy="36" rx="4" ry="7" fill="#FFFFFF" opacity="0.75" transform="rotate(-15 37 36)"/>

  <!-- Engine Cowling Exhaust Housings -->
  <rect x="16" y="70" width="10" height="12" rx="3" fill="#15171F" stroke="#3AE0FF" stroke-width="1.2"/>
  <rect x="54" y="70" width="10" height="12" rx="3" fill="#15171F" stroke="#3AE0FF" stroke-width="1.2"/>

  <!-- High-Tech Neon Circuit Decals -->
  <line x1="32" y1="62" x2="48" y2="62" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="40" cy="62" r="2.2" fill="#3AE0FF"/>
  <line x1="40" y1="62" x2="40" y2="76" stroke="#3AE0FF" stroke-width="1.5"/>

  <!-- Wingtip Strobe Beacons -->
  <circle cx="3" cy="66" r="2" fill="#FFFFFF"/>
  <circle cx="77" cy="66" r="2" fill="#FFFFFF"/>
</svg>
