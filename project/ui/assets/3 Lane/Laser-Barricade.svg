<svg width="120" height="70" viewBox="0 0 120 70" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Laser Beam Pulse Gradient -->
    <linearGradient id="signalLaser" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="25%" stop-color="#FF3B2F"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#FF3B2F"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>

    <!-- Transverse Core Glow -->
    <linearGradient id="transverseBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3B2F" stop-opacity="0.3"/>
      <stop offset="15%" stop-color="#FF3B2F"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#FF3B2F"/>
      <stop offset="100%" stop-color="#FF3B2F" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Heavy Carbon Armor Pylon -->
    <linearGradient id="carbonPylon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22242C"/>
      <stop offset="40%" stop-color="#14151B"/>
      <stop offset="100%" stop-color="#0B0C0F"/>
    </linearGradient>

    <!-- Caution Stripe Pattern -->
    <pattern id="cautionStripes" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="5" height="10" fill="#FF3B2F"/>
      <rect x="5" y="0" width="5" height="10" fill="#0C0D10"/>
    </pattern>
  </defs>

  <!-- Ambient Hazard Energy Field -->
  <ellipse cx="60" cy="35" rx="56" ry="24" fill="#FF3B2F" opacity="0.14"/>

  <!-- Left Barrier Pylon Tower -->
  <rect x="2" y="4" width="22" height="62" rx="5" fill="url(#carbonPylon)" stroke="#FF3B2F" stroke-width="1.2"/>
  <rect x="6" y="8" width="14" height="12" rx="3" fill="#0B0C10" stroke="#FF6B6B" stroke-width="0.8"/>
  <!-- Left Emitter Lens (Glowing Red Core) -->
  <circle cx="13" cy="14" r="5" fill="#FF3B2F"/>
  <circle cx="13" cy="14" r="2.5" fill="#FFFFFF"/>
  <!-- Left Hazard Base Band -->
  <rect x="4" y="46" width="18" height="16" rx="2" fill="url(#cautionStripes)"/>

  <!-- Right Barrier Pylon Tower -->
  <rect x="96" y="4" width="22" height="62" rx="5" fill="url(#carbonPylon)" stroke="#FF3B2F" stroke-width="1.2"/>
  <rect x="100" y="8" width="14" height="12" rx="3" fill="#0B0C10" stroke="#FF6B6B" stroke-width="0.8"/>
  <!-- Right Emitter Lens (Glowing Red Core) -->
  <circle cx="107" cy="14" r="5" fill="#FF3B2F"/>
  <circle cx="107" cy="14" r="2.5" fill="#FFFFFF"/>
  <!-- Right Hazard Base Band -->
  <rect x="98" y="46" width="18" height="16" rx="2" fill="url(#cautionStripes)"/>

  <!-- High-Energy Transverse Laser Beam (The Deadly Obstacle) -->
  <!-- Outer Bloom -->
  <rect x="20" y="6" width="80" height="16" rx="8" fill="#FF3B2F" opacity="0.22"/>
  <!-- Main Laser Conduit -->
  <rect x="22" y="10" width="76" height="8" rx="4" fill="url(#transverseBeam)"/>
  <!-- Burning Core -->
  <rect x="22" y="12.5" width="76" height="3" rx="1.5" fill="#FFFFFF" opacity="0.95"/>

  <!-- Energy Arc Sparkles along Beam -->
  <circle cx="42" cy="14" r="1.5" fill="#FFFFFF"/>
  <circle cx="60" cy="14" r="2.0" fill="#FFFFFF"/>
  <circle cx="78" cy="14" r="1.5" fill="#FFFFFF"/>

  <!-- Lower Shockwave Guard Rail -->
  <rect x="22" y="52" width="76" height="6" rx="2" fill="#14151B" stroke="#FF3B2F" stroke-width="1" opacity="0.8"/>
  <line x1="26" y1="55" x2="94" y2="55" stroke="#FF3B2F" stroke-width="1.2" stroke-dasharray="6,4"/>
</svg>
