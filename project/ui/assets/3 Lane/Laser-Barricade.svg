  <rect x="2" y="34" width="22" height="2.5" fill="#7C3AED" opacity="0.4"/>
  <rect x="2" y="46" width="22" height="2.5" fill="#7C3AED" opacity="0.4"/>
  <rect x="2" y="52" width="22" height="9" rx="3" fill="#F59E0B" opacity="0.38"/>
  <rect x="2" y="60" width="22" height="8" rx="3" fill="#F59E0B" opacity="0.18"/>
  <rect x="2" y="12" width="22" height="20" rx="4" fill="#2D1B69"/>
  <rect x="5" y="14" width="16" height="16" rx="3" fill="#EF4444" opacity="0.5" filter="url(#laserGlow)"/>
  <circle cx="13" cy="22" r="5" fill="#EF4444" filter="url(#emitterGlow)"/>
  <circle cx="13" cy="22" r="3" fill="#FF6B6B"/>
  <circle cx="13" cy="22" r="1.5" fill="#FFFFFF" opacity="0.9"/>

  <rect x="96" y="0" width="22" height="70" rx="5" fill="#1E0A50"/>
  <rect x="99" y="2" width="16" height="66" rx="4" fill="#2D1B69"/>
  <rect x="99" y="2" width="5" height="66" rx="2" fill="#FFFFFF" opacity="0.06"/>
  <rect x="96" y="22" width="22" height="2.5" fill="#7C3AED" opacity="0.4"/>
  <rect x="96" y="34" width="22" height="2.5" fill="#7C3AED" opacity="0.4"/>
  <rect x="96" y="46" width="22" height="2.5" fill="#7C3AED" opacity="0.4"/>
  <rect x="96" y="52" width="22" height="9" rx="3" fill="#F59E0B" opacity="0.38"/>
  <rect x="96" y="60" width="22" height="8" rx="3" fill="#F59E0B" opacity="0.18"/>
  <rect x="96" y="12" width="22" height="20" rx="4" fill="#2D1B69"/>
  <rect x="99" y="14" width="16" height="16" rx="3" fill="#EF4444" opacity="0.5" filter="url(#laserGlow)"/>
  <circle cx="107" cy="22" r="5" fill="#EF4444" filter="url(#emitterGlow)"/>
  <circle cx="107" cy="22" r="3" fill="#FF6B6B"/>
  <circle cx="107" cy="22" r="1.5" fill="#FFFFFF" opacity="0.9"/>

  <rect x="24" y="14" width="72" height="16" rx="8" fill="#EF4444" opacity="0.15" filter="url(#emitterGlow)"/>
  <rect x="24" y="18" width="72" height="8" rx="4" fill="url(#laserBeam)" filter="url(#laserGlow)"/>
