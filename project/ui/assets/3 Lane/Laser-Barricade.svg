<svg width="120" height="70" viewBox="0 0 120 70" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="laserGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="emitterGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.1"/>
      <stop offset="10%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#FCA5A5"/>
      <stop offset="90%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect x="2" y="0" width="22" height="70" rx="5" fill="#1E0A50"/>
  <rect x="5" y="2" width="16" height="66" rx="4" fill="#2D1B69"/>
  <rect x="5" y="2" width="5" height="66" rx="2" fill="#FFFFFF" opacity="0.06"/>
