<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100" height="100" rx="16" fill="#1A1640"/>
  <rect width="100" height="100" rx="16" fill="none" stroke="#2A2560" stroke-width="2"/>

  <!-- Mini dino silhouette (corner hint) -->
  <rect x="68" y="62" width="16" height="11" rx="3" fill="#EF4444" opacity="0.28"/>
  <rect x="76" y="57" width="11" height="8" rx="2" fill="#EF4444" opacity="0.28"/>
  <rect x="85" y="62" width="5" height="4" rx="1" fill="#EF4444" opacity="0.28"/>
  <rect x="69" y="72" width="5" height="9" rx="2" fill="#EF4444" opacity="0.28"/>
  <rect x="76" y="72" width="5" height="9" rx="2" fill="#EF4444" opacity="0.28"/>

  <!-- Head -->
  <circle cx="46" cy="21" r="9" fill="#06B6D4" filter="url(#glow)"/>
  <circle cx="43" cy="18" r="4" fill="#FFFFFF" opacity="0.15"/>

  <!-- Body -->
  <line x1="46" y1="30" x2="46" y2="62" stroke="#06B6D4" stroke-width="5.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Arms spread wide (jumping jacks up) -->
  <line x1="46" y1="40" x2="18" y2="22" stroke="#06B6D4" stroke-width="5.5" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="46" y1="40" x2="74" y2="22" stroke="#06B6D4" stroke-width="5.5" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="18" cy="22" r="4.5" fill="#0EA5E9" filter="url(#glow)"/>
  <circle cx="74" cy="22" r="4.5" fill="#0EA5E9" filter="url(#glow)"/>

  <!-- Legs spread wide -->
  <line x1="46" y1="62" x2="22" y2="87" stroke="#06B6D4" stroke-width="5.5" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="46" y1="62" x2="70" y2="87" stroke="#06B6D4" stroke-width="5.5" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="22" cy="87" r="4.5" fill="#0EA5E9" filter="url(#glow)"/>
  <circle cx="70" cy="87" r="4.5" fill="#0EA5E9" filter="url(#glow)"/>

  <!-- Motion trails -->
  <line x1="12" y1="18" x2="8" y2="15" stroke="#67E8F9" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="80" y1="18" x2="84" y2="15" stroke="#67E8F9" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="16" y1="91" x2="12" y2="95" stroke="#67E8F9" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="76" y1="91" x2="80" y2="95" stroke="#67E8F9" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
</svg>
